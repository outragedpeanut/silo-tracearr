name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go mod tidy
      - run: make test
      - run: make build VERSION=${GITHUB_REF_NAME#v}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
